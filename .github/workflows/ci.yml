name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  DISABLE_SENTRY: "true"
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'ci-placeholder' }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'ci-placeholder.firebaseapp.com' }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'propig-63524' }}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'propig-63524.firebasestorage.app' }}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:000000000000:web:0000000000000000000000' }}
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID || '' }}

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Release and security contracts
        run: npm run verify:release-static

      - name: Build static web app
        run: npm run build

      - name: Browser release gate on built static artifact
        run: |
          npx playwright install --with-deps chromium
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$(node -e "const { chromium } = require('playwright-core'); process.stdout.write(chromium.executablePath())")"
          export CHROME_PATH="$PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH"
          node scripts/serve-static-export.mjs > "$RUNNER_TEMP/propig-browser.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:3002/__propig_static_health >/dev/null; then break; fi
            if [ "$attempt" -eq 90 ]; then cat "$RUNNER_TEMP/propig-browser.log"; exit 1; fi
            sleep 2
          done
          node -e "fetch('http://127.0.0.1:3002/__propig_static_health').then(r=>r.json()).then(v=>{if(v.kind!=='propig-static-export'||v.apiProxy!==false)throw Error('Wrong QA server')}).catch(e=>{console.error(e);process.exitCode=1})"
          BASE_URL=http://127.0.0.1:3002 npm run verify:release-browser

  functions:
    name: Firebase Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Build functions
        run: npm run build --prefix functions
