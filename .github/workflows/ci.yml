name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  DISABLE_SENTRY: "true"
  NEXT_PUBLIC_DISABLE_SENTRY: "true"
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'ci-placeholder' }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'ci-placeholder.firebaseapp.com' }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'propig-63524' }}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'propig-63524.firebasestorage.app' }}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:000000000000:web:0000000000000000000000' }}
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID || '' }}
  NEXT_PUBLIC_FIREBASE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_ID || 'pppp' }}

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Release and security contracts
        run: npm run verify:release-static

      - name: Build static web app
        run: npm run build

      - name: Browser release gate on built static artifact
        run: bash .github/scripts/verify-static-browser.sh

      - name: Package verified hosting files
        run: tar -czf "$RUNNER_TEMP/propig-hosting.tgz" .next-static-export firebase.json .firebaserc

      - name: Save verified hosting artifact
        uses: actions/upload-artifact@v4
        with:
          name: hosting-${{ github.sha }}
          path: ${{ runner.temp }}/propig-hosting.tgz
          if-no-files-found: error
          retention-days: 3

  functions:
    name: Firebase Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Build functions
        run: npm run build --prefix functions

  preview:
    name: Firebase Hosting preview
    needs: [web, functions]
    if: >-
      github.repository == 'playzzin/propig' &&
      github.event_name == 'push' &&
      github.ref != 'refs/heads/main' &&
      !startsWith(github.ref, 'refs/heads/dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'propig-63524' }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download this commit's verified hosting files
        uses: actions/download-artifact@v4
        with:
          name: hosting-${{ github.sha }}
          path: ${{ runner.temp }}/hosting-artifact

      - name: Extract hosting files
        run: tar -xzf "$RUNNER_TEMP/hosting-artifact/propig-hosting.tgz"

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15

      - name: Authenticate Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::error::Missing GitHub Secret: FIREBASE_SERVICE_ACCOUNT (repository or preview environment)'
            exit 1
          fi
          umask 077
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials" >> "$GITHUB_ENV"

      - name: Deploy preview channel
        id: deploy
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          channel="branch-$(printf '%s' "$BRANCH_NAME" | sha256sum | cut -c1-16)"
          firebase hosting:channel:deploy "$channel" \
            --project "$FIREBASE_PROJECT_ID" \
            --expires 7d --non-interactive --json > "$RUNNER_TEMP/preview-result.json"
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/preview-result.json`, 'utf8'));
          const results = Object.values(data.result || {});
          const url = results.find(value => typeof value?.url === 'string')?.url;
          if (data.status !== 'success' || !url) throw new Error('Firebase did not return a preview URL');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Preview: ${url}\n\nVerified commit: \`${process.env.GITHUB_SHA}\`\n\nExpires in 7 days. Hosting only; backend services use the existing Firebase project.\n`);
          NODE

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"
