name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  DISABLE_SENTRY: "true"
  NEXT_PUBLIC_DISABLE_SENTRY: "true"
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY || 'ci-placeholder' }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'ci-placeholder.firebaseapp.com' }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'propig-63524' }}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'propig-63524.firebasestorage.app' }}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '000000000000' }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID || '1:000000000000:web:0000000000000000000000' }}
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID || '' }}
  NEXT_PUBLIC_FIREBASE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_ID || 'pppp' }}

jobs:
  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate preview build configuration
        if: >-
          github.repository == 'playzzin/propig' &&
          github.event_name == 'push' &&
          github.ref != 'refs/heads/main' &&
          !startsWith(github.ref, 'refs/heads/dependabot/')
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          PREVIEW_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'propig-63524' }}
        run: |
          for name in \
            NEXT_PUBLIC_FIREBASE_API_KEY NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            NEXT_PUBLIC_FIREBASE_PROJECT_ID NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID NEXT_PUBLIC_FIREBASE_APP_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Preview build requires repository secret: $name"
              exit 1
            fi
          done
          if [ "$NEXT_PUBLIC_FIREBASE_PROJECT_ID" != "$PREVIEW_FIREBASE_PROJECT_ID" ]; then
            echo '::error::Build and preview Firebase project IDs must match'
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Test Firebase Hosting preview tools
        run: node --test .github/scripts/hosting-preview.test.mjs .github/scripts/require-preview-qa.test.mjs scripts/verify-pr-preview.test.mjs

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Release and security contracts
        run: npm run verify:release-static

      - name: Build static web app
        run: npm run build

      - name: Browser release gate on built static artifact
        run: bash .github/scripts/verify-static-browser.sh

      - name: Package verified hosting files
        run: tar -czf "$RUNNER_TEMP/propig-hosting.tgz" .next-static-export firebase.json .firebaserc .github/scripts/hosting-preview.mjs

      - name: Save verified hosting artifact
        uses: actions/upload-artifact@v4
        with:
          name: hosting-${{ github.sha }}
          path: ${{ runner.temp }}/propig-hosting.tgz
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  functions:
    name: Firebase Functions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Build functions
        run: npm run build --prefix functions

  preview:
    name: Firebase Hosting preview
    needs: [web, functions]
    if: >-
      github.repository == 'playzzin/propig' &&
      github.event_name == 'push' &&
      github.ref != 'refs/heads/main' &&
      !startsWith(github.ref, 'refs/heads/dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize writes and cleanup of the same branch's preview channel.
    concurrency:
      group: firebase-hosting-preview-${{ github.ref_name }}
      queue: max
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      published: ${{ steps.deploy.outcome == 'success' }}
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'propig-63524' }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download this commit's verified hosting files
        uses: actions/download-artifact@v4
        with:
          name: hosting-${{ github.sha }}
          path: ${{ runner.temp }}/hosting-artifact

      - name: Extract hosting files
        run: tar -xzf "$RUNNER_TEMP/hosting-artifact/propig-hosting.tgz"

      - name: Check preview branch head
        id: preview-ref
        run: node .github/scripts/hosting-preview.mjs prepare-deploy

      - name: Install Firebase CLI
        if: steps.preview-ref.outputs.channel != ''
        run: npm install --global firebase-tools@15

      - name: Authenticate Firebase
        if: steps.preview-ref.outputs.channel != ''
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::error::Missing GitHub Secret: FIREBASE_SERVICE_ACCOUNT (repository or preview environment)'
            exit 1
          fi
          umask 077
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials" >> "$GITHUB_ENV"

      - name: Deploy preview channel
        if: steps.preview-ref.outputs.channel != ''
        id: deploy
        env:
          PREVIEW_CHANNEL: ${{ steps.preview-ref.outputs.channel }}
        run: |
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/preview-commit.txt"
          cp "$RUNNER_TEMP/preview-commit.txt" .next-static-export/propig-preview-commit.txt
          firebase hosting:channel:deploy "$PREVIEW_CHANNEL" \
            --project "$FIREBASE_PROJECT_ID" \
            --expires 7d --non-interactive --json > "$RUNNER_TEMP/preview-result.json"
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/preview-result.json`, 'utf8'));
          const results = Object.values(data.result || {});
          const url = results.find(value => typeof value?.url === 'string')?.url;
          if (data.status !== 'success' || !url) throw new Error('Firebase did not return a preview URL');
          const prefix = process.env.FIREBASE_PROJECT_ID + '--' + process.env.PREVIEW_CHANNEL + '-';
          const host = new URL(url).hostname;
          const suffix = host.slice(prefix.length, -'.web.app'.length);
          if (host !== prefix + suffix + '.web.app' || !/^[a-z0-9]+$/.test(suffix)) throw new Error('Unexpected Firebase channel URL');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'channel_suffix=' + suffix + '\n');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/preview-url.txt`, `${url}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Preview: ${url}\n\nVerified commit: \`${process.env.GITHUB_SHA}\`\n\nExpires in 7 days. Hosting only; backend services use the existing Firebase project.\n`);
          NODE

      - name: Save public preview link
        if: steps.preview-ref.outputs.channel != ''
        uses: actions/upload-artifact@v4
        with:
          name: preview-link-${{ github.sha }}
          path: ${{ runner.temp }}/preview-url.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      # The public channel ID is readable via the Actions API even when a QA PC
      # cannot reach the artifact ZIP's storage host. Keep preview-url.txt for manual review.
      - name: Record the public channel and commit for QA
        if: steps.preview-ref.outputs.channel != ''
        uses: actions/upload-artifact@v4
        with:
          name: preview-channel-${{ steps.preview-ref.outputs.channel }}-${{ steps.deploy.outputs.channel_suffix }}
          path: ${{ runner.temp }}/preview-commit.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json"

  preview-qa:
    name: Cloud preview QA
    needs: preview
    if: needs.preview.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            ops/hermes
            scripts
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ops/hermes/toolchain-package-lock.json
      - name: Read this run's published Firebase URL
        uses: actions/download-artifact@v4
        with:
          name: preview-link-${{ github.sha }}
          path: ${{ runner.temp }}/published-preview
      - name: Install the preview checker and Chromium
        run: npm run qa:setup
      - name: Check the published site at 390px and 1440px
        run: |
          IFS= read -r PREVIEW_URL < "$RUNNER_TEMP/published-preview/preview-url.txt"
          export PREVIEW_URL
          npm run qa:preview -- --deployed
      - name: Save browser report, logs and screenshots
        id: evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-qa-${{ github.sha }}
          path: output/preview-qa/deployed/
          if-no-files-found: error
          retention-days: 7
          overwrite: true
      - name: Link evidence in the run summary
        if: ${{ !cancelled() && steps.evidence.outputs.artifact-url != '' }}
        env:
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          printf 'Commit `%s` · [Browser report, logs and screenshots](%s)\n' "$GITHUB_SHA" "$EVIDENCE_URL" >> "$GITHUB_STEP_SUMMARY"

  web-result:
    # Branch protection already requires the GitHub Actions check named Web app.
    name: Web app
    needs: [web, functions, preview, preview-qa]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    env:
      CHECK_SOURCE_PUSH: ${{ github.repository == 'playzzin/propig' && (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')) }}
    steps:
      - name: Require successful builds and the requested branch preview checks
        env:
          WEB_RESULT: ${{ needs.web.result }}
          FUNCTIONS_RESULT: ${{ needs.functions.result }}
          PREVIEW_RESULT: ${{ needs.preview.result }}
          QA_RESULT: ${{ needs.preview-qa.result }}
          EXPECT_PREVIEW: ${{ github.repository == 'playzzin/propig' && github.event_name == 'push' && github.ref != 'refs/heads/main' }}
        run: |
          if [[ "$WEB_RESULT" != success || "$FUNCTIONS_RESULT" != success ]]; then
            echo "::error::Web build: $WEB_RESULT. Firebase Functions: $FUNCTIONS_RESULT."
            exit 1
          fi
          if [[ "$EXPECT_PREVIEW" == true && ( "$PREVIEW_RESULT" != success || "$QA_RESULT" != success ) ]]; then
            echo "::error::Firebase preview: $PREVIEW_RESULT. Cloud preview QA: $QA_RESULT."
            exit 1
          fi
      - uses: actions/checkout@v4
        if: env.CHECK_SOURCE_PUSH == 'true'
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Require the successful preview QA from the exact branch push
        if: env.CHECK_SOURCE_PUSH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          QA_HEAD_REPO: ${{ github.event_name == 'workflow_dispatch' && github.repository || github.event.pull_request.head.repo.full_name }}
          QA_HEAD_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.pull_request.head.ref }}
          QA_HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.pull_request.head.sha }}
        run: node .github/scripts/require-preview-qa.mjs
