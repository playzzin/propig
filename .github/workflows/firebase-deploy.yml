name: Firebase Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy-main
  cancel-in-progress: false

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  DISABLE_SENTRY: "true"
  NEXT_PUBLIC_DISABLE_SENTRY: "true"
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'propig-63524' }}
  NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
  NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
  NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
  NEXT_PUBLIC_FIREBASE_DATABASE_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_DATABASE_ID || 'pppp' }}

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    if: github.repository == 'playzzin/propig' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Validate required GitHub Secrets
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in \
            FIREBASE_SERVICE_ACCOUNT \
            NEXT_PUBLIC_FIREBASE_API_KEY \
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN \
            NEXT_PUBLIC_FIREBASE_PROJECT_ID \
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET \
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID \
            NEXT_PUBLIC_FIREBASE_APP_ID
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Secret: $name"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix functions

      - name: Verify web app
        run: |
          npm run lint
          npm run type-check
          npm test
          npm run verify:release-static
          npm run build

      - name: Browser release gate on built static artifact
        run: bash .github/scripts/verify-static-browser.sh

      - name: Verify functions
        run: npm run build --prefix functions

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15

      - name: Authenticate Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          printf "%s" "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials" >> "$GITHUB_ENV"

      - name: Deploy desktop login and account market functions
        run: |
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only functions:createHabitDesktopLogin,functions:redeemHabitDesktopLogin,functions:createHabitDesktopWorkspaceSession,functions:accountMarket \
            --non-interactive

      - name: Verify desktop login and account market functions
        run: |
          origin="https://asia-northeast3-${FIREBASE_PROJECT_ID}.cloudfunctions.net"
          response="$RUNNER_TEMP/habit-login-response.json"

          check_callable() {
            local function_name="$1" expected_http="$2" expected_status="$3" http_status
            http_status=$(curl --silent --show-error --max-time 30 --retry 2 \
              --header 'Content-Type: application/json' --data '{"data":{}}' \
              --output "$response" --write-out '%{http_code}' "$origin/$function_name")
            if [[ "$http_status" != "$expected_http" ]] || \
              ! jq -e --arg expected "$expected_status" '.error.status == $expected' "$response" > /dev/null; then
              echo "::error::$function_name returned HTTP $http_status, expected HTTP $expected_http and $expected_status"
              return 1
            fi
          }

          check_callable createHabitDesktopLogin 401 UNAUTHENTICATED
          check_callable redeemHabitDesktopLogin 403 PERMISSION_DENIED
          check_callable createHabitDesktopWorkspaceSession 401 UNAUTHENTICATED
          check_callable accountMarket 401 UNAUTHENTICATED

      - name: Deploy Firebase Hosting
        run: |
          firebase deploy \
            --project "$FIREBASE_PROJECT_ID" \
            --only hosting \
            --non-interactive

      - name: Verify Windows habit login page
        run: |
          page="$RUNNER_TEMP/habit-login-page.html"
          curl --fail --silent --show-error --location --max-time 30 --retry 2 \
            --output "$page" "https://${FIREBASE_PROJECT_ID}.web.app/habit-tracker/connect"
          grep -Fq 'Windows 습관 위젯 연결' "$page"
