<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>승인 전달 완료 · ProPig 습관</title>
  <style>
    :root {
      color-scheme: dark;
      font: 16px/1.6 "Malgun Gothic", system-ui, sans-serif;
      background: #0c181b;
      color: #f2f7f4;
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      box-sizing: border-box;
      padding: clamp(16px, 5vw, 40px);
      display: grid;
      place-items: center;
      background: radial-gradient(ellipse at top, #1a3934, #0c181b 66%);
      word-break: keep-all;
      overflow-wrap: anywhere;
    }
    main {
      box-sizing: border-box;
      width: min(100%, 32rem);
      padding: clamp(24px, 5vw, 40px);
      border: 1px solid #365559;
      border-radius: 24px;
      background: #102126;
      box-shadow: 0 18px 48px #0005;
    }
    .mark {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: #79f0b2;
      color: #092219;
      font-size: 28px;
      font-weight: bold;
    }
    h1 {
      margin: 20px 0 8px;
      font-size: clamp(1.55rem, 5.5vw, 2rem);
      line-height: 1.35;
      letter-spacing: -0.04em;
    }
    p { margin: 0; color: #acc4bc; }
    .next {
      margin: 24px 0 16px;
      padding: 14px 16px;
      border: 1px solid #365559;
      border-radius: 12px;
      background: #172e31;
    }
    .next strong { color: #79f0b2; }
    .close-note { font-size: 0.875rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>승인을 Windows 앱에 보냈어요</h1>
    <p>ProPig 습관 앱에서 연결을 이어갑니다.</p>
    <p class="next">Windows 앱으로 돌아가 기존 습관 목록과 <strong>‘동기화됨’</strong> 표시를 확인해 주세요.</p>
    <p class="close-note">이 탭은 닫아도 됩니다.</p>
  </main>
</body>
</html>
