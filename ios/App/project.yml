name: App
options:
  bundleIdPrefix: com.propig.app
  deploymentTarget:
    iOS: "15.0"
packages:
  CapApp-SPM:
    path: CapApp-SPM
settings:
  base:
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 1.1.0
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, App.entitlements, public]
      - path: App/public
        type: folder
        buildPhase: resources
      - path: Shared
    configFiles:
      Debug: ../debug.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.propig.app
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: CapApp-SPM
      - target: TodayWidget
        embed: true
  TodayWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TodayWidget
        excludes: [Info.plist, TodayWidget.entitlements]
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.propig.app.TodayWidget
        INFOPLIST_FILE: TodayWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: TodayWidget/TodayWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  App:
    build:
      targets:
        App: all
